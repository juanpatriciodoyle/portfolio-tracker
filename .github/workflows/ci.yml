name: Portfolio Tracker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend API Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Backend Dependencies & Generate Prisma Client
        run: |
          cd apps/api
          npm ci || npm install
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/portfolio_tracker_db?schema=public"

      - name: Run Backend Tests (Jest)
        run: |
          cd apps/api
          npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/portfolio_tracker_db?schema=public"
          JWT_SECRET: "ci_jwt_secret_key"
          USER_HASH_SALT: "ci_hash_salt"

      - name: Build Backend TypeScript
        run: |
          cd apps/api
          npm run build

  test-frontend:
    name: Frontend Web Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Run Frontend Tests (Vitest)
        run: |
          cd apps/web
          npm test

      - name: Build Frontend Vite App
        run: |
          cd apps/web
          npm run build
