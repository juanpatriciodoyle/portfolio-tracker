# Serves the built app and forwards /api to the API container: one address for both, so the browser never makes a
# cross-origin request and the API needs no CORS. Runs unprivileged on port 8080.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # PDF bills are limited to 5 MB by the API; this only stops anything bigger before it gets there.
  client_max_body_size 6m;

  # The only thing a monitor needs from this container.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # Vite names these files after their content: they never change, so they can be kept for a year.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Never keep the page that points to those files: a new release must be seen at once.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Anything else is a page of the app: the browser's address bar is the router.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }
}
