# The headers every page answer carries. nginx only inherits `add_header` when a block defines none of its own,
# so this file is included wherever a block adds a header (and not in /api/, whose answers carry the API's own).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
# Own scripts only, plus Google's sign-in script and popup and the hCaptcha human check (its script, frame, styles, images and checks). React and Vite need inline styles; Inter comes from Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://hcaptcha.com https://*.hcaptcha.com; connect-src 'self' https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; frame-src https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
